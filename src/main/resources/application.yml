# logistics-simulator 기본 설정. 실제 값은 환경 변수로 넣는다(클러스터에서는 gitops·ArgoCD가 넣는다).
# 프로필은 dev·prod 두 개. SPRING_PROFILES_ACTIVE로 고른다.
server:
  port: 8080

spring:
  application:
    name: logistics-simulator
  jackson:
    time-zone: Asia/Seoul         # 시각은 ISO-8601 +09:00
  cloud:
    aws:
      region:
        static: ${AWS_REGION:ap-northeast-2}
      # 자격은 기본 체인(클러스터: IRSA, PC: aws login 프로필)

simulator:
  # 보낼 큐. 클러스터는 QUEUE_PREFIX=dev- (공용 큐), PC에서는 QUEUE_PREFIX=dev-<내 이름>- (개인 큐)
  queue: ${QUEUE_PREFIX:dev-}inventory-commands.fifo
  # 시연 프리셋: 요청 본문 없이 POST /simulator/shipments 하면 이대로 보낸다.
  # 점포 ID·상품 코드는 dev 더미 데이터(infra scripts/seed/dev-*.sql)와 같다. 유통기한은 그날 23:59:59 한국 시간
  preset:
    store-ids: [1, 2, 3]
    items:
      - product-code: P016        # 순한 컵라면 110g
        quantity: 20
        expiry-date: 2026-10-20
      - product-code: P012        # 흰 우유 500ml (유통기한 지난 재고 시연)
        quantity: 10
        expiry-date: 2026-10-09

  # 매일 시나리오 (3차 할 일 1-2, 1-4). 켜고 끄기·값은 gitops envs/<env>/logistics-simulator/values.yaml 환경 변수로 넣는다.
  # dev는 입고만(주문 끔), prod는 주말 포함 매일 입고 09:20 + 주문 10:00–20:00
  schedule:
    enabled: ${SIMULATOR_SCHEDULE_ENABLED:false}
    inbound-cron: ${SIMULATOR_INBOUND_CRON:0 20 9 * * MON-FRI}
    inbound-on-startup: ${SIMULATOR_INBOUND_ON_STARTUP:true}
    stores: ${SIMULATOR_STORES:}               # 비면 고객 단골 점포 전부. 예: 1,2,3
    customers: ${SIMULATOR_CUSTOMERS:}         # "sub:4,7;sub:5" (External Secret)
    orders:
      enabled: ${SIMULATOR_ORDERS_ENABLED:false}
      per-store-min: ${SIMULATOR_ORDERS_PER_STORE_MIN:2}
      per-store-max: ${SIMULATOR_ORDERS_PER_STORE_MAX:3}
      window-start: "10:00"
      window-end: "20:00"
      unpaid-rate: 0.05
      cancel-rate: ${SIMULATOR_CANCEL_RATE:0}
    pickup:
      no-show-rate: 0.1
    services:
      order: ${ORDER_URL:http://order-service:8080}
      inventory: ${INVENTORY_URL:http://inventory-service:8080}
      member: ${MEMBER_URL:http://member-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: health, prometheus
  endpoint:
    health:
      probes:
        enabled: true             # /actuator/health/liveness, /readiness
